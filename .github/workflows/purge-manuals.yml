name: Purge Manuals & Vector Index

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate purge without deleting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Purge Script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: 2aa73cfb-cf41-4ab3-b614-b0cf1eb7ec0c
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/purge-manuals.ts --dry-run
          else
            npx tsx scripts/purge-manuals.ts
          fi
