name: Sync Manuals to Vectorize

on:
  push:
    branches:
      - main
    paths:
      - 'docs/manuals/**.pdf'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/manuals/**.pdf'
      - 'scripts/ingest-manuals.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Linter
        run: pnpm lint

      - name: Run Unit and Integration Tests
        run: pnpm test

      - name: Dry-Run Ingestion Script
        env:
          CLOUDFLARE_ACCOUNT_ID: "mock-account-id"
          CLOUDFLARE_API_TOKEN: "mock-token"
          ADDED_MODIFIED_FILES: "tests/fixtures/sample-manual.pdf"
        run: npx tsx scripts/ingest-manuals.ts --dry-run

  sync-manuals:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare changes against previous commit

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Get Changed PDF Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            docs/manuals/**.pdf

      - name: Run Ingestion Script
        if: steps.changed-files.outputs.any_changed == 'true' || steps.changed-files.outputs.any_deleted == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADDED_MODIFIED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        run: npx tsx scripts/ingest-manuals.ts
