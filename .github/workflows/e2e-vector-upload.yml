name: E2E Vector Upload Test

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'scripts/ingest-manuals.ts'
      - 'scripts/sync-r2-manuals.ts'
      - 'scripts/e2e-vectorize-smoke-test.ts'
      - 'tests/fixtures/sample-manual.pdf'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-vector-upload:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Real R2 + Vectorize E2E Smoke Test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npx tsx scripts/e2e-vectorize-smoke-test.ts
