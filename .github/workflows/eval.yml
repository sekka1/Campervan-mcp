name: Model Benchmark Evals (Live Endpoint)

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Promptfoo & MCP SDK Runtime
        run: npm install -g @modelcontextprotocol/sdk promptfoo

      - name: Run Promptfoo Benchmark against Live Server
        run: |
          promptfoo eval -c promptfooconfig.yaml -o report.html --max-concurrency 2
        env:
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
          PROMPTFOO_FAILED_TEST_EXIT_CODE: 0

      - name: Upload HTML Benchmark Report
        if: always() # Uploads even if assertions fail
        uses: actions/upload-artifact@v4
        with:
          name: campervan-model-benchmark-report
          path: report.html
