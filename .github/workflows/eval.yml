name: Model Benchmark Evals (Live Endpoint)

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Pegged to Node 22 LTS (fully supported by Promptfoo)

      - name: Run Promptfoo Benchmark against Live Server
        run: |
          npx promptfoo@latest eval -c promptfooconfig.yaml
        env:
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
