name: sync-r2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # Daily sync

jobs:
  sync-manuals:
    name: Sync R2 Manuals & Generate Embeddings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || npm ci || pnpm install

      - name: Run Manuals Ingestion & Vector Sync
        env:
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'deepinfra' }}
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/sync-r2-manuals.ts
