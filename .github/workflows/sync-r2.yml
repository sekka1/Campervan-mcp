name: Manual Sync R2 Manuals to Vectorize

on:
  workflow_dispatch:
    inputs:
      force_reindex:
        description: 'Force re-indexing of all PDFs in R2 (ignores manifest cache)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run R2 Sync Script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE_REINDEX: ${{ inputs.force_reindex }}
        run: npx tsx scripts/sync-r2-manuals.ts
