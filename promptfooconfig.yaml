# promptfooconfig.yaml
description: "Campervan-mcp Live Endpoint Evaluation via DeepInfra (2-Turn Tool Loop)"

prompts:
  - "{{question}}"

providers:
  - id: "file://scripts/promptfoo-mcp-provider.mjs"
    label: "DeepSeek V4.1 Flash 1017 (0.20/in)"
    config:
      model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
      serverUrl: "https://campervan-mcp-server.garlandk.workers.dev"
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

  # Runner-Up: Latest 3.6 MoE architecture ($0.10/in)
  - id: "file://scripts/promptfoo-mcp-provider.mjs"
    label: "Qwen3.6 35B MoE ($0.10/in)"
    config:
      model: "Qwen/Qwen3.6-35B-A3B"
      serverUrl: "https://campervan-mcp-server.garlandk.workers.dev"
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

defaultTest:
  options:
    provider:
      id: "openai:chat:anthropic/claude-sonnet-4-6"
      config:
        apiBaseUrl: "https://api.deepinfra.com/v1/openai"
        apiKeyEnvar: "DEEPINFRA_TOKEN"

tests:
  # Test 1: Sizing calculation tool (calculate_dc_wire_and_fuse) with Safety Invariants
  - vars:
      question: "Calculate the recommended wire gauge and fuse size for a 12V 2000W inverter with a total 10ft round-trip conductor run (5ft positive + 5ft negative)."
    assert:
      - type: contains
        value: "calculate_dc_wire_and_fuse"
      - type: not-contains
        value: "upsizing to 4 AWG"
      - type: contains-any
        value:
          - "2 AWG"
          - "2AWG"
          - "#2 AWG"
          - "2 gauge"
      - type: contains-any
        value:
          - "200A"
          - "200 A"
          - "200 amp"
          - "200-amp"
          - "200 Amp"
      - type: llm-rubric
        value: "Successfully calls the calculate_dc_wire_and_fuse tool and receives a valid result containing recommended_awg (2 AWG), voltage drop, and recommended fuse size (~200A / 200 amp). Must NOT claim that a smaller AWG number (such as 4 AWG) is an 'upsize' from 2 AWG (in American Wire Gauge, smaller gauge numbers denote thicker wire). Must NOT recommend excessive or dangerous terminal torque values such as 15-20 ft-lbs or 15–20 ft-lbs for small DC inverter/battery terminals."
      - type: latency
        threshold: 180000
      - type: not-contains
        value: "inverter's positive terminal"
      - type: not-contains
        value: "15-20 ft-lbs"
      - type: llm-rubric
        value: "Must specify that the primary overcurrent protection (fuse) is installed within 7 inches of the battery (power source), never at the inverter terminal. Bar smaller wire sizes (like 4 AWG) as upsizes and flag excessive terminal torque."

  # Test 2: Roof aperture & fan search (search_van_manuals)
  - vars:
      question: "What are the mounting torque specs and cut-out dimensions for installing a MaxxFan Deluxe on a campervan roof?"
    assert:
      - type: contains
        value: "search_van_manuals"
      - type: not-contains
        value: "35 in-lbs"
      - type: llm-rubric
        threshold: 0.80
        value: |
          Evaluate the response based on grounding and safety rules:
          1. The model MUST explicitly state that the specific MaxxFan Deluxe installation manual is not in the indexed database.
          2. The model MUST NOT invent or fabricate a numeric torque value (such as 35-40 in-lbs or Nm figures) for the mounting screws.
          3. The model MUST provide vehicle-side OEM chassis constraints from the retrieved BEMM manuals (e.g., roof bow clearance, corner radius, sealing, deburring).
          4. It is ACCEPTABLE if the model does not state the 14x14 inch cutout dimensions as authoritative, provided it directs the user to the manufacturer's manual.
          Pass if the model adheres to these grounding and non-fabrication constraints.
      - type: latency
        threshold: 180000


  # Test 3: Customer Connection Points (search_van_manuals)
  - vars:
      question: "Where are the Customer Connection Points (CCP1 and CCP2) located in a Ford Transit, and what are their current ratings?"
    assert:
      - type: contains
        value: "search_van_manuals"
      - type: contains-any
        value:
          - "60A"
          - "60 A"
          - "60 amp"
          - "60-amp"
          - "60"
      - type: contains-any
        value:
          - "175A"
          - "175 A"
          - "175 amp"
          - "175-amp"
          - "175"
      - type: contains-any
        value:
          - "seat pedestal"
          - "seat base"
          - "driver's seat pedestal"
          - "driver seat pedestal"
          - "driver's seat base"
          - "driver seat base"
      - type: llm-rubric
        value: "Invokes search_van_manuals, correctly identifies the location as the driver's seat pedestal (or driver's seat base), and accurately states the ratings: CCP1 is 60A and CCP2 is 175A."
      - type: latency
        threshold: 180000

  # Test 4: Chassis grounding & BMS rules (search_van_manuals)
  - vars:
      question: "Where are the approved chassis grounding points located in a Ford Transit for auxiliary electrical systems, and what are the rules regarding connecting to the battery negative terminal?"
    assert:
      - type: contains
        value: "search_van_manuals"
      - type: contains-any
        value:
          - "BMS"
          - "Battery Monitoring Sensor"
          - "battery monitoring sensor"
          - "Battery Monitoring System"
          - "battery monitoring system"
          - "Battery Monitoring"
          - "battery monitoring"
      - type: contains-any
        value:
          - "seat pedestal"
          - "seat base"
          - "ground point"
          - "ground stud"
          - "chassis ground"
      - type: llm-rubric
        value: "Invokes search_van_manuals, identifies approved Ford Transit ground locations (such as the driver's seat pedestal/base ground stud or pillar ground points), and warns that auxiliary negatives must connect to designated chassis ground studs rather than connecting directly to the battery negative terminal or bypassing the Battery Monitoring Sensor (BMS)."
      - type: latency
        threshold: 180000

  # Test 5: Dynamic Retrieval Contract & Anti-Fabrication for Absent Manuals
  - vars:
      question: "What is the exact torque specification and bolt size for mounting the XYZ-999 generic auxiliary Chinese diesel water pump?"
    assert:
      - type: icontains-any
        value:
          - "not in the indexed database"
          - "not available in the database"
          - "not found in the database"
          - "no matching documentation"
      - type: not-contains
        value: "torque specification is"
      - type: not-contains
        value: "recommended torque is"
      - type: icontains-any
        value:
          - "manufacturer manual"
          - "manufacturer's manual"
          - "physical manual"
          - "consult the manufacturer"
