# promptfooconfig.yaml
description: "Campervan-mcp Live Endpoint Evaluation via DeepInfra"

# Define the live MCP server once
mcpConfig: &mcp
  mcp:
    servers:
      - name: campervan
        url: "https://campervan-mcp-server.garlandk.workers.dev/"

providers:
  - id: "openai:chat:deepseek-ai/DeepSeek-V4-Flash-0731"
    label: "DeepSeek V4 Flash 0731"
    config:
      <<: *mcp
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

  - id: "openai:chat:meta-llama/Llama-4-Scout-17B-16E-Instruct"
    label: "Llama 4 Scout 17B (16E)"
    config:
      <<: *mcp
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

  - id: "openai:chat:google/gemma-3-27b-it"
    label: "Gemma 3 27B IT"
    config:
      <<: *mcp
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

  - id: "openai:chat:google/gemma-3-4b-it"
    label: "Gemma 3 4B IT"
    config:
      <<: *mcp
      apiBaseUrl: "https://api.deepinfra.com/v1/openai"
      apiKeyEnvar: "DEEPINFRA_TOKEN"

defaultTest:
  options:
    # Dedicated Judge on DeepInfra
    provider:
      id: "openai:chat:anthropic/claude-sonnet-4-6"
      config:
        apiBaseUrl: "https://api.deepinfra.com/v1/openai"
        apiKeyEnvar: "DEEPINFRA_TOKEN"

prompts:
  - "{{question}}"

tests:
  - vars:
      question: "Calculate the recommended wire gauge and fuse size for a 12V 2000W inverter with a 10ft round-trip run."
    assert:
      - type: llm-rubric
        value: "Invokes the calculate_dc_wire_and_fuse tool, calculates continuous current (~167A at 12V), recommends at least 2/0 AWG copper wire and a 250A-300A fuse, and references safe voltage drop limits (<3%)."
      - type: latency
        threshold: 8000

  - vars:
      question: "What are the mounting torque specs and cut-out dimensions for installing a MaxxFan Deluxe on a campervan roof?"
    assert:
      - type: llm-rubric
        value: "Invokes the search_van_manuals tool and accurately cites standard 14x14 inch roof cut-out dimensions and manufacturer mounting torque guidelines."
      - type: latency
        threshold: 8000
